<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kolorhunt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=DM+Mono:wght@400;500&family=Gochi+Hand&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
  <header class="top">
    <span class="brand">Kolorhunt</span>
    <nav id="tabs">
      <a href="#color" data-tab="color">Color hunt</a>
      <a href="#shape" data-tab="shape">Shape hunt</a>
      <a href="#echos" data-tab="echos">Échos</a>
      <a href="#hasard" data-tab="hasard">Au hasard</a>
    </nav>
    <span class="muted">Camille × Virgil — un rouleau par semaine</span>
  </header>
  <p class="tabdesc" id="tabdesc"></p>

  <section id="v-hunt">
  <div id="rolls" class="rolls"></div>

  <div class="meta">
    <span id="sheet" class="nowrap"></span>
    <span class="muted"><span id="count"></span> vues<span id="legend"></span></span>
  </div>

  <div id="people" class="people"></div>

  <footer class="foot">
    <a href="#" id="prev">← Rouleau précédent</a>
    <span class="muted">Kolorhunt</span>
    <a href="#" id="next">Rouleau suivant →</a>
  </footer>
  </section>

  <section id="v-echos" hidden>
    <div class="seg"><button data-m="couleur" class="on">Par couleur</button><button data-m="forme">Par texture</button></div>
    <p class="hint" id="hint"></p>
    <div id="pairs" class="pairs"></div>
  </section>

  <section id="v-hasard" hidden></section>
</div>

<div id="lightbox" class="lightbox" hidden><img alt=""><p></p></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="circled" viewBox="0 0 100 100" preserveAspectRatio="none">
    <path d="M60 5 C30 1 5 18 6 50 C7 82 36 98 64 93 C90 88 99 60 95 36 C91 13 70 2 42 8 C33 10 27 14 22 19" fill="none" stroke="#e2462c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" opacity=".92"/>
    <path d="M57 7 C31 4 9 20 9 50 C9 80 37 95 63 90 C87 85 96 59 92 37" fill="none" stroke="#e2462c" stroke-width="1.6" stroke-linecap="round" vector-effect="non-scaling-stroke" opacity=".45"/>
  </symbol>
</svg>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
